name: Sync ClickUp → Painel BCP

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync ClickUp → painel.html
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: |
          python sync.py 2>&1 | tee sync_log.txt
          exit ${PIPESTATUS[0]}

      - name: Salvar log de erro se falhou
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sync_log.txt
          git diff --staged --quiet || git commit -m "debug: sync log $(date '+%d/%m/%Y %H:%M')"
          git push

      - name: Push se houve mudanças
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add painel.html
          git diff --staged --quiet || git commit -m "sync: ClickUp $(date '+%d/%m/%Y %H:%M')"
          git push
