name: Sync ClickUp → Painel

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Testar token ClickUp
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: |
          echo "Token length: ${#CLICKUP_TOKEN}"
          python3 -c "
import urllib.request, json, os
token = os.environ.get('CLICKUP_TOKEN', '')
print('Token presente:', len(token) > 0)
print('Token inicio:', token[:10] if token else 'VAZIO')
req = urllib.request.Request(
    'https://api.clickup.com/api/v2/list/901327467073/task?page=0&subtasks=true&include_closed=true',
    headers={'Authorization': token}
)
try:
    with urllib.request.urlopen(req, timeout=30) as r:
        data = json.loads(r.read())
        print('Tarefas:', len(data.get('tasks', [])))
except Exception as e:
    print('ERRO:', e)
    import sys; sys.exit(1)
"

      - name: Sync ClickUp e gerar painel
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: python sync.py

      - name: Commit e Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add painel.html
          git diff --staged --quiet || git commit -m "sync: auto $(date +'%d/%m/%Y %H:%M')"
          git push
